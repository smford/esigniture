<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background App Tile -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="4"/>

  <!-- Signature baseline -->
  <line x1="80" y1="360" x2="432" y2="360" stroke="rgba(255, 255, 255, 0.3)" stroke-width="6" stroke-dasharray="12 12" stroke-linecap="round"/>
  <text x="60" y="366" font-family="sans-serif" font-size="28" font-weight="bold" fill="rgba(255, 255, 255, 0.4)">✕</text>

  <!-- Elegant Signature Flow -->
  <path d="M 120 330 Q 170 200, 210 270 T 290 280 T 370 240 Q 400 310, 430 330" fill="none" stroke="url(#strokeGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Fountain Pen Nib Symbol -->
  <g transform="translate(320, 110) rotate(15) scale(1.6)" filter="url(#glow)">
    <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
    <line x1="16" y1="8" x2="2" y2="22" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="11" cy="13" r="2" fill="#2563eb"/>
  </g>
</svg>
